# Builds the Windows installer on GitHub's Windows machine.
#  - every push to main: builds and keeps the installer as a workflow artifact (for a quick test)
#  - a version tag (v0.1.0): builds and publishes a GitHub Release with AlexBooks-Setup.exe attached
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build installer
        run: npx tauri build
      - name: Name the installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName out/AlexBooks-Setup.exe
          Get-Item out/AlexBooks-Setup.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: AlexBooks-Setup
          path: out/AlexBooks-Setup.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/AlexBooks-Setup.exe
          body_path: RELEASE-NOTES.md
