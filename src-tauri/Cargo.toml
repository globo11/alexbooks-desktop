[package]
name = "alexbooks-desktop"
version = "1.5.0"
description = "AlexBooks for Windows — the office's own window onto the AlexBooks server"
authors = ["Alex Tax Services Corp"]
edition = "2021"

[lib]
name = "alexbooks_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["time"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

# 1.5.0 (engine.rs): the page engine's own interface, for what the toolkit has no setting for. The same versions the
# toolkit itself uses, so there is still one copy of each in the program.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
