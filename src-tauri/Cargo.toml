[package]
name = "alexbooks-desktop"
version = "0.1.0"
description = "AlexBooks for Windows — the office's own window onto the AlexBooks server"
authors = ["Alex Tax Services Corp"]
edition = "2021"

[lib]
name = "alexbooks_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
